name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install fastapi redis sqlalchemy

    - name: Run simple test
      run: |
        python -c "import fastapi"

    - name: Build Docker image
      run: |
        docker build -t job-system-api ./api