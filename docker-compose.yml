version: "3.8"

services:

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: job-system-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: job-system-worker
    depends_on:
      - redis
      - db

  redis:
    image: redis:7
    container_name: job-system-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: job-system-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    ports:
      - "5432:5432"